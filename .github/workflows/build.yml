name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Projektordner finden
        id: find
        run: |
          f=$(find . -name settings.gradle | head -n 1)
          if [ -z "$f" ]; then
            echo "settings.gradle NICHT gefunden. Das liegt im Repository:"
            find . -not -path "./.git/*" | head -60
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14

      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build --no-daemon

      - name: JAR hochladen
        uses: actions/upload-artifact@v4
        with:
          name: auction-hud
          path: ${{ steps.find.outputs.dir }}/build/libs/*.jar
